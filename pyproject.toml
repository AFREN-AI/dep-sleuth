[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkg-sentry"
version = "0.1.0"
description = "Check AI-suggested npm and PyPI dependencies before installation."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Hadriel Wonda" }]
dependencies = []

[project.scripts]
pkg-sentry = "pkgsentry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

